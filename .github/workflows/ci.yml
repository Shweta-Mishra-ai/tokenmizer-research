name: CI
on: [push, pull_request]
jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate corpus grounding
        run: |
          python3 -c "
          from benchmarks.memorybench import corpus
          sessions = corpus.load()
          corpus.validate_grounding(sessions)
          print(corpus.describe(sessions))
          "
      # tokenmizer_v0.5.2 is skipped in CI: it shells out to a checkout of
      # the product repo (TOKENMIZER_PRODUCT_REPO, default
      # /home/user/tokenmizer), which this runner doesn't have. The other
      # 7 methods have no external dependency and run every commit.
      - name: Run n=100 multi-method benchmark (reimplemented methods)
        run: python3 -m benchmarks.memorybench.run --skip tokenmizer_v0.5.2 --json /tmp/memorybench_ci.json
      - name: Run legacy n=21 benchmark
        run: python3 benchmarks/checkpoint_accuracy/runner_v2.py --json
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.python-version }}
          path: |
            /tmp/memorybench_ci.json
            benchmarks/results/
