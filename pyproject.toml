[project]
name = "tokenmizer-research"
version = "2.0.0"
description = "Research repository for TokenMizer: benchmark suite, evaluation corpus, and published results for graph-structured LLM session memory."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shweta Mishra", email = "shweta.mishra.research@gmail.com" }]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/Shweta-Mishra-ai/tokenmizer-research"
Product = "https://github.com/Shweta-Mishra-ai/tokenmizer"

# The benchmark suite (benchmarks/) is pure standard-library Python and
# requires no installation: run it directly with
#   python -m benchmarks.memorybench.run
# from the repository root. matplotlib is only needed to regenerate the
# figures in paper/figures/ (pip install matplotlib numpy).
