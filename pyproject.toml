[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenmizer"
version = "1.0.0"
description = "Graph-structured session memory for efficient LLM context preservation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shweta Mishra", email = "shweta.mishra.research@gmail.com" }]
keywords = ["llm", "context", "memory", "graph", "session", "proxy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tiktoken>=0.6.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.25.0"]
cache = ["sentence-transformers>=2.7.0"]
compress = ["llmlingua>=0.2.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "httpx>=0.27"]
all = ["tokenmizer[anthropic,cache,compress]"]

[project.scripts]
tokenmizer = "tokenmizer.api.cli:app"

[project.urls]
Homepage = "https://github.com/Shweta-Mishra-ai/tokenmizer"
Repository = "https://github.com/Shweta-Mishra-ai/tokenmizer"
Paper = "https://arxiv.org"
